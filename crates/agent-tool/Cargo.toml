[package]
name = "agent-tool"
version = "0.1.0"
edition = "2021"

[dependencies]
# The contract names no product. `agent-llm` is a leaf (the wire types a tool
# result can carry); everything else is a third-party crate.
agent-llm = { path = "../agent-llm" }
# Pure path resolution, a leaf: tools that name themselves in a User-Agent
# or keep workspace-local state need somewhere to look.
agent-paths = { path = "../agent-paths" }
futures.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
