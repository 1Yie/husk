[package]
name = "agent-kernel"
version = "0.1.0"
edition = "2021"
description = "Pure async orchestration engine: tool registry, ReAct loop, permissions, compaction — no iced, no reqwest"
license = "MIT"

[dependencies]
agent-tool = { path = "../agent-tool" }
agent-llm = { path = "../agent-llm" }
agent-ipc = { path = "../agent-ipc" }
agent-plugin = { path = "../agent-plugin" }
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
schemars.workspace = true

[dev-dependencies]
agent-testkit = { path = "../agent-testkit" }
async-trait.workspace = true

[features]
# On by default — WASM plugins are a shipped feature, not an opt-in demo.
# `--no-default-features` builds without the wasmtime JIT for lean builds.
default = ["wasm"]
wasm = ["agent-plugin/wasm"]
