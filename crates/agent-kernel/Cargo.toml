[package]
name = "agent-kernel"
version = "0.1.0"
edition = "2021"
description = "Pure async orchestration engine: tool registry, ReAct loop, permissions, compaction — no iced, no reqwest"
license = "MIT"

[dependencies]
agent-tool = { path = "../agent-tool" }
agent-skills = { path = "../agent-skills" }
agent-store = { path = "../agent-store" }
agent-context = { path = "../agent-context" }
agent-llm = { path = "../agent-llm" }
agent-ipc = { path = "../agent-ipc" }
agent-paths = { path = "../agent-paths" }
agent-sandbox = { path = "../agent-sandbox" }
agent-computer = { path = "../agent-computer" }
agent-plugin = { path = "../agent-plugin" }
agent-tools-computer = { path = "../agent-tools-computer" }
agent-tools-fs = { path = "../agent-tools-fs" }
agent-tools-shell = { path = "../agent-tools-shell" }
agent-tools-web = { path = "../agent-tools-web" }
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
schemars.workspace = true
xxhash-rust.workspace = true
ignore.workspace = true
dirs.workspace = true
redb = "4.3.0"
fs2 = "0.4"
tempfile = "3"

[dev-dependencies]
agent-tools-serena = { path = "../agent-tools-serena" }
agent-testkit = { path = "../agent-testkit" }
tempfile = "3"
# The computer-use acceptance test installs a scripted desktop backend and
# writes a real PNG through it — both crates are normal deps, listed here for
# the test target's own imports.
agent-computer = { path = "../agent-computer" }
image.workspace = true
async-trait.workspace = true

[features]
# On by default — WASM plugins are a shipped feature, not an opt-in demo.
# `--no-default-features` builds without the wasmtime JIT for lean builds.
default = ["wasm"]
wasm = ["agent-plugin/wasm"]
# The outline extractor lives with the file tools; the feature just forwards.
tree-sitter = ["agent-tools-fs/tree-sitter"]
