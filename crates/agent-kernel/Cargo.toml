[package]
name = "agent-kernel"
version = "0.1.0"
edition = "2021"
description = "Pure async orchestration engine: tool registry, ReAct loop, permissions, compaction — no iced, no reqwest"
license = "MIT"

[dependencies]
agent-context = { path = "../agent-context" }
agent-llm = { path = "../agent-llm" }
agent-ipc = { path = "../agent-ipc" }
agent-sandbox = { path = "../agent-sandbox" }
agent-computer = { path = "../agent-computer" }
agent-plugin = { path = "../agent-plugin" }
reqwest.workspace = true
htmd.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
schemars.workspace = true
similar.workspace = true
strsim.workspace = true
xxhash-rust.workspace = true
ignore.workspace = true
globset.workspace = true
dirs.workspace = true
redb = "4.3.0"
grep-searcher.workspace = true
grep-regex.workspace = true
grep-matcher.workspace = true
tree-sitter = { version = "0.27.0", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }

[dev-dependencies]
tempfile = "3"
# The computer-use acceptance test installs a scripted desktop backend and
# writes a real PNG through it — both crates are normal deps, listed here for
# the test target's own imports.
agent-computer = { path = "../agent-computer" }
image.workspace = true
async-trait.workspace = true

[features]
# On by default — WASM plugins are a shipped feature, not an opt-in demo.
# `--no-default-features` builds without the wasmtime JIT for lean builds.
default = ["wasm"]
wasm = ["agent-plugin/wasm"]
tree-sitter = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
]
