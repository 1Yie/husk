[package]
name = "app-cli"
version = "0.1.0"
edition = "2021"
description = "Headless CLI frontend for the agent kernel — thin adapter over agent-ipc events"
license = "MIT"

[[bin]]
name = "husk-cli"
path = "src/main.rs"

[dependencies]
agent-paths = { path = "../agent-paths" }
agent-kernel = { path = "../agent-kernel" }
husk-host = { path = "../husk-host" }
agent-llm = { path = "../agent-llm" }
agent-ipc = { path = "../agent-ipc" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
async-trait.workspace = true
futures.workspace = true
