<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Husk — computer control</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
    }
    /* A single hairline ring at the very edge of the screen — no blobs,
       no blobs, no inward wash. Just one clean 2px accent line that
       breathes, so "the AI owns the screen" reads as a border, not a
       lighting rig. */
    .ring {
      position: fixed;
      inset: 0;
      border-radius: 2px;
      box-shadow: inset 0 0 0 2px rgba(139, 124, 247, 0.65);
      animation: breathe 3s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div class="ring"></div>
</body>
</html>
