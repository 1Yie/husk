[package]
name = "app-tauri"
version = "0.1.0"
edition = "2021"
description = "Tauri desktop shell — React + Tailwind frontend over the shared kernel wiring"
build = "build.rs"

[[bin]]
name = "agent-rs"
path = "backend/main.rs"

[dependencies]
agent-context = { path = "../agent-context" }
agent-kernel = { path = "../agent-kernel" }
agent-ipc = { path = "../agent-ipc" }
agent-llm = { path = "../agent-llm" }
agent-sandbox = { path = "../agent-sandbox" }
dirs.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rfd = "0.15"

[features]
default = []
# Enabled automatically by `tauri build` for production bundles.
# MUST NOT be a default feature — it makes the app serve `frontendDist`
# via tauri://localhost and ignores `build.devUrl`, which kills the dev
# server + HMR flow under `cargo tauri dev`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
