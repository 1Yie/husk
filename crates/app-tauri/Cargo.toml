[package]
name = "husk"
version = "0.3.8"
edition = "2021"
description = "Husk — Tauri desktop shell: React + Tailwind frontend over the shared kernel wiring"
license = "MIT"
build = "build.rs"

[[bin]]
name = "husk"
path = "backend/main.rs"

[dependencies]
agent-context = { path = "../agent-context" }
agent-kernel = { workspace = true }
agent-store = { path = "../agent-store" }
husk-host = { path = "../husk-host" }
agent-skills.workspace = true
agent-ipc = { workspace = true }
agent-llm = { path = "../agent-llm" }
agent-paths = { workspace = true }
agent-sandbox = { workspace = true }
dirs.workspace = true
base64.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
reqwest.workspace = true
rfd = "0.15"
png = "0.17"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
xxhash-rust.workspace = true
futures.workspace = true
sha2 = "0.10"
tracing.workspace = true
tracing-subscriber = "0.3"
# Private per-download staging directories (0700 on Unix) that auto-clean on
# drop; also the source of the Windows staged-installer cache helper.
tempfile = "3"

# The desktop notification IPC is shared, with native UNUserNotificationCenter
# on macOS and notify-rust on Linux/Windows. Do not enable notify-rust's legacy
# NSUserNotificationCenter backend on macOS.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSDictionary", "NSError", "NSObject", "NSSet", "NSString", "NSUUID"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter"] }

# Linux trays go through a raw StatusNotifierItem: the libappindicator backend
# behind Tauri's tray icon cannot tell left from right click (both open the
# menu). `ksni` exposes `Activate` — left click — separately from the DBusMenu
# the shell opens on right click.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# WebKitWebView handle (via Tauri's `with_webview`) for `web-process-terminated`
# recovery. Same pinned version/features wry builds against; features are additive.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
# Wayland overlay placement (computer-use HUD/glow): GTK3 layer-shell, system lib.
# FFI only: the safe 0.8 wrapper keeps its functions crate-private (see
# backend/ipc/layer_shell.rs). System lib is 0.10.0.
gtk-layer-shell-sys = { version = "0.7", features = ["v0_6"] }
ksni = { version = "0.3", features = ["blocking"] }

[features]
default = []
# WASM plugin runtime — compiles wasmtime into the app. Now ON by default
# through `agent-kernel`'s default features; this explicit feature remains
# as the opt-in spelling for consumers that disabled kernel defaults.
wasm = ["husk-host/wasm"]
# Enabled automatically by `tauri build` for production bundles.
# MUST NOT be a default feature — it makes the app serve `frontendDist`
# via tauri://localhost and ignores `build.devUrl`, which kills the dev
# server + HMR flow under `cargo tauri dev`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
