[package]
name = "husk-host"
version = "0.1.0"
edition = "2021"
description = "Host layer over agent-kernel: session assembly, commands, mode table, sandbox preferences"
license = "MIT"

[dependencies]
agent-kernel = { path = "../../../korei/crates/agent-kernel" }
agent-capabilities = { path = "../../../korei-ext/crates/agent-capabilities", features = ["sandbox", "desktop"] }
agent-coding = { path = "../agent-coding" }
agent-llm = { path = "../agent-llm" }
agent-ipc = { path = "../../../korei/crates/agent-ipc" }
agent-sandbox = { path = "../../../korei-ext/crates/agent-sandbox" }
agent-context = { path = "../agent-context" }
agent-plugin = { path = "../../../korei-ext/crates/agent-plugin" }
agent-skills = { path = "../agent-skills" }
agent-store = { path = "../agent-store" }
agent-tools-fs = { path = "../../../korei-ext/crates/agent-tools-fs" }
agent-tools-shell = { path = "../../../korei-ext/crates/agent-tools-shell" }
agent-tools-web = { path = "../../../korei-ext/crates/agent-tools-web" }
agent-tools-computer = { path = "../../../korei-ext/crates/agent-tools-computer" }
agent-tools-office = { path = "../../../korei-ext/crates/agent-tools-office" }
agent-tools-serena = { path = "../../../korei-ext/crates/agent-tools-serena" }
agent-paths = { path = "../../../korei-ext/crates/agent-paths" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
futures.workspace = true
async-trait.workspace = true
toml.workspace = true
dirs.workspace = true
ignore.workspace = true
tempfile = "3"

[dev-dependencies]
agent-testkit = { path = "../../../korei/crates/agent-testkit" }
agent-computer = { path = "../../../korei-ext/crates/agent-computer" }
image.workspace = true

[features]
wasm = ["agent-plugin/wasm"]
tree-sitter = ["agent-tools-fs/tree-sitter"]
