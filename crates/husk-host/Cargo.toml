[package]
name = "husk-host"
version = "0.1.0"
edition = "2021"
description = "Host layer over agent-kernel: session assembly, commands, mode table, sandbox preferences"
license = "MIT"

[dependencies]
agent-kernel = { workspace = true }
agent-capabilities = { workspace = true, features = ["sandbox", "desktop"] }
agent-coding = { path = "../agent-coding" }
agent-llm = { path = "../agent-llm" }
agent-ipc = { workspace = true }
agent-sandbox = { workspace = true }
agent-context = { path = "../agent-context" }
agent-plugin = { workspace = true }
agent-skills.workspace = true
agent-store = { path = "../agent-store" }
agent-tools-fs = { workspace = true }
agent-tools-shell = { workspace = true }
agent-tools-web = { workspace = true }
agent-tools-computer = { workspace = true }
agent-tools-office = { workspace = true }
agent-tools-serena = { workspace = true }
agent-paths = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
futures.workspace = true
async-trait.workspace = true
toml.workspace = true
dirs.workspace = true
ignore.workspace = true
tempfile = "3"

[dev-dependencies]
fs2 = "0.4"
agent-testkit = { workspace = true }
agent-computer = { workspace = true }
image.workspace = true

[features]
wasm = ["agent-plugin/wasm"]
tree-sitter = ["agent-tools-fs/tree-sitter"]
