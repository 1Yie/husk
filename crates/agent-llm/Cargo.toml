[package]
name = "agent-llm"
version = "0.1.0"
edition = "2021"
description = "Pluggable LLM provider layer: normalized StreamChunk over OpenAI-compat/Anthropic/mock adapters"
license = "MIT"

[dependencies]
agent-llm-core = { workspace = true }
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
# reqwest 0.13 — the version rig-core 0.42's `HttpClientExt` is implemented
# against; the rest of the workspace stays on 0.12.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
bytes.workspace = true
toml.workspace = true
toml_edit = "0.25"
keyring.workspace = true
rig-core = "0.42.0"
# HTTP upgrade uses reqwest/rustls (including its proxy support); tungstenite
# handles WebSocket framing, masking and control frames, not a second TLS stack.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
sha2 = "0.10"
tempfile = "3"

[dependencies.tokio]
workspace = true
features = ["time", "rt"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util", "net", "io-util"] }

