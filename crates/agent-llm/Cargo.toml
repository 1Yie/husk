[package]
name = "agent-llm"
version = "0.1.0"
edition = "2021"
description = "Pluggable LLM provider layer: normalized StreamChunk over OpenAI-compat/Anthropic/mock adapters"
license = "MIT"

[dependencies]
agent-llm-core = { workspace = true }
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
# reqwest 0.13 — the version rig-core 0.42's `HttpClientExt` is implemented
# against; the rest of the workspace stays on 0.12.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
bytes.workspace = true
toml.workspace = true
toml_edit = "0.25"
keyring.workspace = true
rig-core = "0.42.0"
tempfile = "3"

[dependencies.tokio]
workspace = true
features = ["time"]

[dev-dependencies]

