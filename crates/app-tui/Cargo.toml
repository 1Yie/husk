[package]
name = "app-tui"
version = "0.1.0"
edition = "2021"
description = "ratatui terminal frontend for the agent kernel — same UiEvent/UiCommand contract as the desktop shell"

[[bin]]
name = "husk-tui"
path = "src/main.rs"

[dependencies]
agent-paths = { path = "../agent-paths" }
agent-kernel = { path = "../agent-kernel" }
husk-host = { path = "../husk-host" }
agent-ipc = { path = "../agent-ipc" }
agent-llm = { path = "../agent-llm" }
agent-sandbox = { path = "../agent-sandbox" }
tokio.workspace = true
anyhow.workspace = true
serde_json.workspace = true
futures.workspace = true
ratatui = { version = "0.30", features = ["all-widgets", "macros", "scrolling-regions"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
libc = "0.2"

[dev-dependencies]
async-trait.workspace = true
tempfile = "3"
