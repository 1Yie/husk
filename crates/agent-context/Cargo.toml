[package]
name = "agent-context"
version = "0.1.0"
edition = "2021"
description = "Workspace perception layer: file-tree scan, git snapshot, hunk tracking, memory"
license = "MIT"

[dependencies]
ignore.workspace = true
gix.workspace = true
similar.workspace = true
thiserror.workspace = true
tracing.workspace = true
redb = "4.3.0"
serde.workspace = true
serde_json.workspace = true
xxhash-rust.workspace = true
hnsw_rs = "0.3"
tokio.workspace = true
# Local sentence embeddings for recall. Pulls ONNX Runtime binaries plus a
# ~250 MB model downloaded on first use, so it is opt-in: rustls keeps the
# TLS stack out of the dependency tree (this crate forbids `reqwest`).
fastembed = { version = "7", optional = true, default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
] }

[features]
default = []
# Recall scored by a local multilingual embedding model instead of the
# bag-of-hashed-tokens stand-in. See `memory::semantic`.
semantic = ["dep:fastembed"]

[dev-dependencies]
tempfile = "3"
