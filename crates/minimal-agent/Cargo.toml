[package]
name = "minimal-agent"
version = "0.1.0"
edition = "2021"
publish = false

# The point of this crate: from the workspace, only these two. If the
# decoupling holds, a second product needs nothing else — no sandbox, no
# desktop, no session store, no coding semantics.
[dependencies]
agent-kernel = { path = "../agent-kernel" }
agent-llm = { path = "../agent-llm" }
futures.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `chat_stream` returns anyhow's error and is an async trait method.
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
