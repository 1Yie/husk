[workspace]
resolver = "2"
members = ["crates/*"]
# iced GUI experiment — kept locally, not tracked/built by the workspace.
exclude = ["crates/app-desktop"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"

# zero C/C++ dynamic deps: rustls only, never openssl-sys
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
htmd = "0.5"
eventsource-stream = "0.2"
bytes = "1"

# agent-context — pure Rust only, no C linkage (Operating Principle 1)
ignore = "0.4"
globset = "0.4"
gix = { version = "0.87", default-features = false, features = ["status", "sha1"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
similar = "2"
strsim = "0.11"

# agent-llm
toml = "0.9"
dirs = "6"
base64 = "0.22"
keyring = { version = "4", features = ["v1"] }

# agent-computer — desktop control (computer use). Pure-Rust PNG scaling only.
image = { version = "0.25", default-features = false, features = ["png"] }

# agent-kernel tools
schemars = "1"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"

# The kernel and its extensions live in their own repositories.
agent-ipc = { git = "ssh://git@github.com/1Yie/korei.git", branch = "main" }
agent-llm-core = { git = "ssh://git@github.com/1Yie/korei.git", branch = "main" }
agent-tool = { git = "ssh://git@github.com/1Yie/korei.git", branch = "main" }
agent-kernel = { git = "ssh://git@github.com/1Yie/korei.git", branch = "main" }
agent-testkit = { git = "ssh://git@github.com/1Yie/korei.git", branch = "main" }
agent-capabilities = { git = "ssh://git@github.com/1Yie/korei-ext.git", branch = "main" }
agent-sandbox = { git = "ssh://git@github.com/1Yie/korei-ext.git", branch = "main" }
agent-computer = { git = "ssh://git@github.com/1Yie/korei-ext.git", branch = "main" }
agent-plugin = { git = "ssh://git@github.com/1Yie/korei-ext.git", branch = "main" }
agent-paths = { git = "ssh://git@github.com/1Yie/korei-ext.git", branch = "main" }
agent-tools-computer = { git = "ssh://git@github.com/1Yie/korei-ext.git", branch = "main" }
agent-tools-fs = { git = "ssh://git@github.com/1Yie/korei-ext.git", branch = "main" }
agent-tools-office = { git = "ssh://git@github.com/1Yie/korei-ext.git", branch = "main" }
agent-tools-serena = { git = "ssh://git@github.com/1Yie/korei-ext.git", branch = "main" }
agent-tools-shell = { git = "ssh://git@github.com/1Yie/korei-ext.git", branch = "main" }
agent-skills = { git = "ssh://git@github.com/1Yie/korei-ext.git", branch = "main" }
agent-tools-web = { git = "ssh://git@github.com/1Yie/korei-ext.git", branch = "main" }

[profile.dev]
panic = "unwind"       # tests need unwinding; debug UX needs backtraces

# wasmtime/cranelift at opt-level 0 compile and run guests ~10x slower, which
# is what made WASM plugins hang the dev app on load and reload.
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"        # no unwinding → smaller, faster; crash = process death + restart, never half-state
strip = true
debug = "line-tables-only"   # keep symbols for crash reports without full debuginfo
