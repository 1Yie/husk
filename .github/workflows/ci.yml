name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-law:
    name: Dependency law
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `cargo metadata --no-deps` resolves nothing and compiles nothing.
      - run: ./scripts/check-deps.sh
