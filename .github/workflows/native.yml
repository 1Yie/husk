name: native

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-tests:
    name: Native logic and PTY tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: terminal-linux
      - run: ./scripts/check-deps.sh
      - run: cargo fmt -p husk-terminal --check
      - run: nice -n 10 cargo test --locked -p husk-terminal --no-default-features --lib
      - run: nice -n 10 cargo check --locked -p husk-terminal --all-targets

  platform-check:
    name: Check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: terminal-${{ matrix.target }}
      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
      - run: cargo check --locked -p husk-terminal --no-default-features --all-targets --target ${{ matrix.target }}
