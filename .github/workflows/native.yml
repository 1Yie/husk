name: native

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-tests:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: Native logic and PTY tests
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: Native logic and PTY tests (ARM64)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: terminal-${{ matrix.target }}
      - run: ./scripts/check-deps.sh
      - run: cargo fmt -p husk-terminal --check
      - run: nice -n 10 cargo test --locked -p husk-terminal --no-default-features --lib --target ${{ matrix.target }}
      - run: nice -n 10 cargo check --locked -p husk-terminal --all-targets --target ${{ matrix.target }}
      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libssl-dev libgtk-layer-shell-dev
      - name: Check desktop app and shared dependencies
        run: nice -n 10 cargo check --locked -p husk --all-targets --target ${{ matrix.target }}

  platform-check:
    name: Check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: terminal-${{ matrix.target }}
      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
      - run: cargo check --locked -p husk-terminal --no-default-features --all-targets --target ${{ matrix.target }}
